watchlist:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - META
  - NVDA
  - JPM
  - BAC
  - XOM
  - JNJ
  - D05.SI
  - KO
  - PG
  - WMT
  - MCD
  - VZ
  - T
  - USAR
  - PFE
  - INTC
  - IBM
  - CVS
  - NOK

# ── Data ──────────────────────────────────────────────────────────
data:
  lookback_days: 364
  interval: "1d"

# ── Signal generation ─────────────────────────────────────────────
signals:
  zscore_window: 20
  zscore_entry: 2.0
  zscore_exit: 0.5
  rsi_window: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_window: 20
  bb_std: 2.0
  min_confidence: 60

# ── Regime filter ─────────────────────────────────────────────────
regime:
  vix_max: 35.0
  adx_max: 31.0
  adx_window: 14
  trend_slope_window: 20

# ── Momentum strategy ─────────────────────────────────────────────
momentum:
  adx_min: 31.0
  rsi_ceiling: 78.0           # reject LONG if RSI above this (exhausted move)
  rsi_floor: 22.0             # reject SHORT if RSI below this
  breakout_window: 20
  volume_mult: 1.2

# ── Multi-timeframe ───────────────────────────────────────────────
mtf:
  weekly_ema_fast: 10
  weekly_ema_slow: 30
  gap_threshold: 0.02

# ── Risk management ───────────────────────────────────────────────
risk:
  max_position_pct: 0.10
  kelly_fraction: 0.25
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 3.0
  max_open_positions: 6
  max_portfolio_dd: 0.08

# ── Portfolio ─────────────────────────────────────────────────────
portfolio:
  initial_capital: 100000.0

mode: suggest

# ── News ──────────────────────────────────────────────────────────
news:
  feeds:
    - https://feeds.finance.yahoo.com/rss/2.0/headline?s={ticker}&region=US&lang=en-US
  max_age_hours: 24

# ── Earnings filter ───────────────────────────────────────────────
earnings:
  buffer_days: 5

# ── Correlation filter ────────────────────────────────────────────
correlation:
  max_r: 0.75
  lookback_days: 60

# ── Exit monitor ──────────────────────────────────────────────────
monitor:
  interval_seconds: 60

# ── Backtest ──────────────────────────────────────────────────────
backtest:
  lookback_days: 730

# ── Screener ──────────────────────────────────────────────────────
screener:
  universe:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    - TSLA
    - JPM
    - BAC
    - GS
    - JNJ
    - PFE
    - CVS
    - ABBV
    - WMT
    - PG
    - KO
    - MCD
    - XOM
    - CVX
    - IBM
    - INTC
    - VZ
    - T
    - SPY
    - QQQ
    - IWM
    - XLF
    - XLE

  lookback_period: "3mo"
  min_bars: 30
  ma_fast: 5
  ma_mid: 10
  ma_slow: 20
  momentum_window: 10
  breakout_window: 20
  breakout_pct: 0.95
  volume_window: 20
  volume_spike_mult: 0.8
  min_price: 5.0
  min_avg_volume: 500000
  min_atr_pct: 0.01