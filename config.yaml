data:
  lookback_days: 364       # how many days of history to pull
  interval: "1d"          # yfinance interval

signals:
  zscore_window: 20       # rolling mean/std window
  zscore_entry: 2.0       # entry threshold (|z| > this)
  zscore_exit: 0.5        # exit when |z| falls below this
  rsi_window: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_window: 20
  bb_std: 2.0
  min_confidence: 60      # minimum score (0-100) to surface a signal

regime:
  vix_max: 35.0           # skip if VIX above this (too volatile)
  adx_max: 31.0           # skip if ADX above this (trending market)
  adx_window: 14
  trend_slope_window: 20  # days for linear slope check

risk:
  max_position_pct: 0.10  # max 10% of portfolio per position
  kelly_fraction: 0.25    # fractional Kelly (conservative)
  stop_loss_atr_mult: 2.0 # stop = entry ± 2×ATR
  take_profit_atr_mult: 3.0
  max_open_positions: 6
  max_portfolio_dd: 0.08  # halt if drawdown > 8%

portfolio:
  initial_capital: 100000.0

mode: suggest             # "suggest" or "auto"

news:
  feeds:
    - https://feeds.finance.yahoo.com/rss/2.0/headline?s={ticker}&region=US&lang=en-US
  max_age_hours: 24

 
earnings:
  buffer_days: 5          # skip ticker if earnings within N days
 
correlation:
  max_r: 0.75             # reject new signal if |r| > this with any open position
  lookback_days: 60       # days of returns used to compute correlation
 
monitor:
  interval_seconds: 60    # how often the exit monitor checks live prices
 
backtest:
  lookback_days: 730      # how much history to pull for backtesting
 

 # ── DELTA config.yaml — paste at bottom ──────────────────────────

momentum:
  adx_min: 31           # only fires when ADX above this (mirrors regime.adx_max)
  breakout_window: 20     # N-day high/low for breakout confirmation
  volume_mult: 1.2        # volume must be this × rolling avg to confirm

mtf:
  weekly_ema_fast: 10     # fast EMA span for weekly trend
  weekly_ema_slow: 30     # slow EMA span for weekly trend
  gap_threshold: 0.02     # % gap between EMAs to call a trend (2%)

# ── DELTA config.yaml — paste at bottom ──────────────────────────

screener:
  # Universe to scan — replaces the hardcoded DEFAULT_UNIVERSE list
  universe:
    # Mega cap tech
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    - TSLA
    # Financials
    - JPM
    - BAC
    - GS
    # Healthcare / pharma
    - JNJ
    - PFE
    - CVS
    - ABBV
    # Consumer
    - WMT
    - PG
    - KO
    - MCD
    # Energy
    - XOM
    - CVX
    # Tech / telecom
    - IBM
    - INTC
    - VZ
    - T
    # ETFs — good for broad momentum reads
    - SPY
    - QQQ
    - IWM
    - XLF
    - XLE

  # Data
  lookback_period: "3mo"      # yfinance period string
  min_bars: 30                # minimum bars needed to screen

  # MA windows
  ma_fast: 5
  ma_mid: 10
  ma_slow: 20

  # Momentum / breakout
  momentum_window: 10         # N-day rolling high for momentum check
  breakout_window: 20         # N-day high for breakout proximity
  breakout_pct: 0.95          # price must be >= this × N-day high

  # Volume
  volume_window: 20            # rolling window for volume spike check
  volume_spike_mult: 0.8      # volume must be this × rolling avg

  # Quality filters — these prevent junk passing the screen
  min_price: 5.0              # skip penny stocks below this price
  min_avg_volume: 500000      # skip illiquid stocks (20-day avg volume)
  min_atr_pct: 0.01           # skip low-vol stocks (ATR must be >1% of price)