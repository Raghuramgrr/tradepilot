[tools]
python = "3.11"

[env]
PYTHONPATH = "."
LOG_LEVEL = "INFO"

# ------------------------
# Tasks
# ------------------------

[tasks.setup]
description = "Create virtual environment and install dependencies"
run = [
  "python -m venv .venv",
  "pip install --upgrade pip",
  "pip install -r requirements.txt || true"
]

